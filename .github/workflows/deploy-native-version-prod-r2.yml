name: Deploy Native Version Policy to R2 (Prod)

on:
  push:
    branches:
      - master
    paths:
      - "apps/mobile/minimum-app-version.json"
      - ".github/workflows/deploy-native-version-prod-r2.yml"
  workflow_dispatch:

concurrency:
  group: deploy-native-version-prod-r2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID_PROD }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY_PROD }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME_PROD }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL_PROD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare prod native version policy
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const filePath = "apps/mobile/minimum-app-version.json";
          const config = JSON.parse(fs.readFileSync(filePath, "utf8"));

          for (const channel of ["dev", "prod"]) {
            for (const platform of ["ios", "android"]) {
              const policy = config?.[channel]?.[platform];
              if (typeof policy?.enabled !== "boolean") {
                throw new Error(`${filePath} ${channel}.${platform}.enabled must be boolean.`);
              }
              if (!/^\d+\.\d+\.\d+$/.test(policy?.minimumVersion ?? "")) {
                throw new Error(
                  `${filePath} ${channel}.${platform}.minimumVersion must use x.y.z format.`
                );
              }
              if (policy.storeUrl !== null && typeof policy.storeUrl !== "string") {
                throw new Error(
                  `${filePath} ${channel}.${platform}.storeUrl must be string or null.`
                );
              }
            }
          }

          const outputPath = path.join(process.env.RUNNER_TEMP, "minimum-app-version.json");
          fs.writeFileSync(outputPath, JSON.stringify(config.prod, null, 2));
          NODE

      - name: Upload native version policy to R2
        run: |
          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp \
            "$RUNNER_TEMP/minimum-app-version.json" \
            "s3://${R2_BUCKET_NAME}/native/minimum-app-version.json" \
            --endpoint-url "$ENDPOINT_URL" \
            --checksum-algorithm CRC32 \
            --content-type "application/json" \
            --cache-control "no-cache"

      - name: Summary
        run: |
          echo "Public policy: ${R2_PUBLIC_BASE_URL}/native/minimum-app-version.json"

fragment DailyLogTodoFields on TodoItem {
  id
  taskId
  titleSnapshot
  content
  done
  order
  startedAt
  scheduledStartAt
  targetFocusMinutes
  pausedAt
  completedAt
  deviationSeconds
  resumeCount
  actualFocusSeconds
  muteReminderDateKey
}

fragment DailyLogDetailFields on DailyLog {
  dateKey
  memo
  restAccumulatedSeconds
  restStartedAt
  todos {
    ...DailyLogTodoFields
  }
}

query DailyLogsByMonth($monthKey: String!) {
  dailyLogsByMonth(monthKey: $monthKey) {
    id
    userId
    dateKey
    monthKey
    memo
    todoCount
    doneCount
    previewTodos
    todos {
      id
      taskId
      titleSnapshot
      content
      done
      order
    }
  }
}

query DailyLogsWithMemo(
  $limit: Int
  $cursorDateKey: String
  $monthKey: String
  $search: String
  $sortOrder: String
) {
  dailyLogsWithMemo(
    limit: $limit
    cursorDateKey: $cursorDateKey
    monthKey: $monthKey
    search: $search
    sortOrder: $sortOrder
  ) {
    items {
      id
      dateKey
      monthKey
      memo
      todoCount
      doneCount
      previewTodos
    }
    nextCursorDateKey
    hasNextPage
  }
}

query DailyLog($dateKey: String!) {
  dailyLog(dateKey: $dateKey) {
    dateKey
    memo
  }
}

mutation UpsertDailyLog($input: UpsertDailyLogInput!) {
  upsertDailyLog(input: $input) {
    dateKey
    memo
  }
}

query DailyLogByDate($dateKey: String!) {
  dailyLog(dateKey: $dateKey) {
    ...DailyLogDetailFields
  }
}

